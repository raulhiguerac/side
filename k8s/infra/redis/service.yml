apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: platform
    env: dev
spec:
  selector:
    app.kubernetes.io/name: redis
    env: dev
  ports:
    - name: redis
      port: 6379
      targetPort: redis