apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: platform
    env: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      env: dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        env: dev
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--maxmemory", "1200mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 1.5Gi
              cpu: 250m