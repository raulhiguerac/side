apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Values.app.name }}-migration"
  annotations:
    # post-install: primer install, DESPUÉS de crear el Cluster CNPG (el wait-for-db espera a que responda).
    # pre-upgrade: en upgrades migra ANTES de rodar los pods nuevos (schema nuevo → luego código nuevo).
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    # borra el Job anterior justo antes de crear el nuevo → los Jobs son inmutables y sin esto el 2º upgrade peta.
    # (no borra tras éxito: dejamos el último Job para poder ver sus logs)
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
spec:
  template:
    metadata:
      labels:
        {{- include "microservice.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      initContainers:
      - name: wait-for-db
        image: {{ .Values.wait.image }}
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: "{{ .Values.app.name }}-cluster-app"
              key: host
        command: ['sh', '-c', 'until pg_isready -h $DB_HOST; do echo esperando db; sleep 2; done']
      containers:
      - name: "migration-{{ .Values.app.containerName }}"
        image: {{ .Values.app.image }}
        command: ["uv", "run", "alembic", "upgrade", "head"]
        env:
        {{- include "microservice.dbEnv" . | nindent 8 }}
      restartPolicy: Never
  backoffLimit: 4

