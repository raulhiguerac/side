# Secrets DUMMY, solo para local/dev (flag .Values.createDummySecrets).
# Se generan DINÁMICAMENTE iterando .Values.secretData (mapa grupo -> {clave: valor}).
# En real -> createDummySecrets=false; los reales llegan por Sealed Secrets / ESO.
# DATABASE_URL NO va aquí: lo genera cnpg (database.yml).
{{- if .Values.createDummySecrets }}
{{- range $name, $data := .Values.secretData }}
---
apiVersion: v1
kind: Secret
metadata:
  name: "{{ $.Values.app.name }}-ms-{{ $name }}"
  labels:
    {{- include "microservice.labels" $ | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}