[project]
name = "analytics-service"
version = "0.1.0"
description = "Microservice"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "redis>=5.2.0",
    "uvicorn>=0.32.0",
    "jupyter>=1.1.1",
    "ipykernel>=7.2.0",
    "pandas>=2.3.3",
    "plotly>=6.7.0",
    "seaborn>=0.13.2",
    "geopandas>=1.1.3",
    "scikit-learn>=1.7.2",
    "h3>=4.4.2",
    "folium>=0.20.0",
    "ipywidgets>=8.1.8",
    "geojson>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
