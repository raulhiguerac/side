[project]
name = "catalog-service"
version = "0.1.0"
description = "Microservice"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "redis>=5.2.0",
    "uvicorn>=0.32.0",
    "geoalchemy2>=0.18.1",
    "mapbox>=0.18.1",
    "overpass>=0.7.2",
    "h3>=4.4.2",
    "pyjwt[cryptography]>=2.8.0",
    "cryptography>=46.0.5",
    "osmium>=3.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
extend = "../ruff.toml"

[tool.ruff.lint]
ignore = ["E712"]
